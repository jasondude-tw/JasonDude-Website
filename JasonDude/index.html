<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Investor Relations – Hims & Hers</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="images/jason-32.png" type="image/png">
   <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;       /* 水平置中 */
      padding: 0 20px;      /* 左右留空，避免緊貼螢幕邊緣 */
      width: 100%;          /* 保證寬度不超過螢幕 */
    }
    .navbar {
      position: sticky;
      background: #fff;
      top: 0;
      z-index: 999;
      border-bottom: 1px solid #ddd;
      height: 60px; 
    }
    .navbar .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;
    }
    .navbar .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 2.5em;
      /*font-weight: bold;*/
      margin-right: 40px;
    }
    .navbar ul {
      list-style: none; margin: 0; padding: 0; display: flex;
    }
    .navbar li {
      position: relative; margin-right: 20px;
    }
    .navbar a {
      text-decoration: none; color: #333; padding: 8px 12px; display: inline-block;
    }
    .navbar li:hover > a {
      background: #f0f0f0;
    }
    .navbar .dropdown {
      cursor: pointer;
    }
    .navbar li .dropdown-menu {
      display: none; position: absolute; top: 100%; left: 0; background: #fff; border: 1px solid #ccc; min-width: 180px; z-index: 1000;
    }
    .navbar li:hover .dropdown-menu {
      display: block;
    }
    .navbar li.open > .dropdown-menu {
      display: block !important;
    }
    .navbar .dropdown-menu li {
      margin: 0;
    }
    .navbar .dropdown-menu a {
      padding: 8px 12px; white-space: nowrap;
    }
    .navbar .dropdown-menu a:hover {
      background: #eee;
    }
    .menu {
      display: flex;
      gap: 20px;  /* 項目間距 */
      list-style: none;
      margin: 0;
      padding: 0;
    }

        /* 中層圖片 */
    .full-width-banner {
      height: 600px;
      overflow: hidden;
    }

    .full-width-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

        /* 主內容樣式 */
    main {
      padding: 40px 0;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    /* 響應式 */
    @media (max-width: 768px) {
      .navbar .container {
        flex-direction: column;
        align-items: flex-start;
      }

      .menu {
        flex-direction: column;
        width: 100%;
        gap: 10px;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="logo">Jason's Life Lab</div>
      <ul class="menu">
        <li><a href="#" data-module="bio">BIO</a></li>
        <li class="dropdown">
          <a href="#">News & Albums ⏷</a>
          <ul class="dropdown-menu">
            <li><a href="#" data-module="news">News</a></li>
            <li><a href="#" data-module="events">Events & Presentations</a></li>
            <li><a href="#" data-module="album1">Album1</a></li>
            <li><a href="#" data-module="album2">Album2</a></li>
          </ul>
        </li>
        <!-- <li><a href="#">Projects ⏷</a></li> -->
        <li class="dropdown">
          <a href="#">Projects ⏷</a>
          <ul class="dropdown-menu">
            <li><a href="#" data-module="project1">Project1</a></li>
            <li><a href="#" data-module="project2">Project2</a></li>
            <li><a href="#" data-module="project3">Project3</a></li>
          </ul>
        <!-- <li><a href="#">Contact</a></li> -->
        <li class="dropdown">
          <a href="#">Contact</a>
          <ul class="dropdown-menu">
            <li><a href="#" data-module="contact">Mail Address</a></li>
            <li><a href="#" data-module="contact">Instagram</a></li>
            <li><a href="https://cn.pornhub.com/model/jasonhousework" target="_blank" rel="noopener">PornHub</a></li>
          </ul>
      </ul>
    </div>
  </nav>

  <div class="full-width-banner">
    <img src="images/hero1.jpg" alt="大圖展示" />
  </div>

  <main>
    <div class="container" id="content">
      <!-- 內容動態載入 -->
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
