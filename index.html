<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Investor Relations – Hims & Hers</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="images/jason-32.png" type="image/png">
  <style>
/*    * {
      outline: 1px solid red !important;
    }*/

    /* --- CSS 檔案最頂部 --- */
    /* (建議所有專案都從這段開始) */
    html {
      box-sizing: border-box;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }

    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;       /* 水平置中 */
      padding: 0 20px;      /* 左右留空，避免緊貼螢幕邊緣 */
      width: 100%;          /* 保證寬度不超過螢幕 */
    }
    .navbar {
      position: relative;
      background: #fff;
      top: 0;
      z-index: 999;
      border-bottom: 1px solid #ddd;
      height: 60px; 
    }
    .navbar .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;
    }
    .navbar .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 2.5em;
      /*font-weight: bold;*/
      margin-right: 40px;
    }
    .navbar ul {
      list-style: none; margin: 0; padding: 0; display: flex; 
    }
    .navbar li {
      position: relative; margin-right: 20px;
    }
    .navbar a {
      text-decoration: none; color: #333; padding: 8px 12px; display: inline-block;
    }
    .navbar li:hover > a {
      background: #f0f0f0;
    }
    .navbar .dropdown {
      cursor: pointer;
    }
    .navbar li .dropdown-menu {
      display: none; position: absolute; top: 100%; left: 0; right: 0; width: auto; background: #fff; border: 1px solid #ccc; min-width: 180px; z-index: 1000;
    }
    .navbar li:hover .dropdown-menu {
      display: block;
    }
    .navbar li.open > .dropdown-menu {
      display: block !important;
    }

    .navbar li.dropdown.open > .dropdown-menu {
        display: block;
    }

    .navbar .dropdown-menu li {
      margin: 0;
    }
    .navbar .dropdown-menu a {
      display: block; width: 100%; padding: 8px 12px; white-space: nowrap;
    }
    .navbar .dropdown-menu a:hover {
      background: #eee;
    }
    .menu {
      display: flex;
      gap: 20px;  /* 項目間距 */
      list-style: none;
      margin: 0;
      padding: 0;
    }
    /* 漢堡選單按鈕樣式 */
    .menu-toggle {
      /* 1. ✨ 關鍵重置：移除瀏覽器預設外觀 */
      -webkit-appearance: none;
      appearance: none;
      background: transparent; /* 移除預設背景 */
      border: none;          /* 移除預設邊框 */
      
      /* 2. 設定我們自己的顏色和樣式 */
      color: #333;      /* ✨ 設定成和其他導覽列文字一樣的深灰色 */
      cursor: pointer;
      padding: 0;        /* 清除預設內距 */
      margin: 0;         /* 清除預設外距 */
      font-size: 24px;   /* 您可以自己調整圖示大小 */
      
      /* 3. 在電腦版預設隱藏 (這行原本就有) */
      display: none;
    }

        /* 中層圖片 */
    .full-width-banner {
      height: 600px;
      overflow: hidden;
    }

    .full-width-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

        /* 主內容樣式 */
    main {
      padding: 40px 0;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    /* 響應式設計：手機版樣式 */
    @media (max-width: 768px) {
        .navbar .container {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;

            /* --- ✨ 關鍵修改在這裡 --- */
            padding-left: 20px;  /* 保留左邊的內距，讓 Logo 和 main 內容對齊 */
            padding-right: 10px;   /* 取消右邊的內距，讓漢堡按鈕可以靠到最右邊 */
        }

        .full-width-banner img {
            object-position: 70% 50%;
        }

        .menu-toggle {
            display: block;
            /* 為按鈕本身增加一些內距，讓它視覺上平衡且容易點擊 */
            padding-right: 20px; 
        }

        /* ... 您其他的手機版樣式 ... */
        .navbar .menu {
            display: none;                 /* 預設隱藏，由 is-active 控制 */
            flex-direction: column;        /* ✨ 就是這一行！指定垂直排列 */
            width: 100%;                   /* 佔滿整個導覽列寬度 */
            background-color: #fff;        /* 給它一個背景色 */
            border-top: 1px solid #ddd;    /* 和上方內容做個分隔 */
            
            /* 以下是可選的美化，建議加上 */
            gap: 0;                        /* 取消項目間距，改用 padding 控制 */
            margin-top: 10px;              /* 和 Logo/漢堡按鈕拉開一點距離 */
            padding: 0;                    /* 清除 ul 預設的 padding */
        }

        .navbar .menu.is-active {
            display: flex;
        }

        /* 1. 在手機上，禁用電腦版的 hover 效果，避免誤觸 */
        .navbar li:hover > .dropdown-menu {
            display: none;
        }

        /* 2. 重新定義子選單在手機上的「外觀」和「定位方式」 */
        .navbar li .dropdown-menu {
            position: static;      /* 改回正常文件流，在主選單內展開 */
            width: 100%;           /* 寬度和父容器一致 */
            box-shadow: none;      /* 移除陰影 */
            border: none;          /* 移除邊框 */
            background-color: #f7f7f7; /* 給個稍微不同的背景色以示區分 */
            
            /* 為了美觀，可以加個內縮排 */
            padding-left: 20px;
            box-sizing: border-box; /* 確保 padding 不會影響寬度計算 */
        }

        /* 3. 實作手機版的「點擊展開」邏輯 */
        .navbar li.dropdown.open > .dropdown-menu {
            display: block; /* 只有當父層 li 有 .open class 時才顯示 */
        }

        .navbar .menu li {
        width: 100%; /* 讓每個列表項都佔滿整行 */
        margin-right: 0; /* 清除電腦版設定的右邊距 */
        }
        
        .navbar .menu li a {
            display: block;  /* 讓整個按鈕區域都可以點擊，而不只是文字 */
            padding: 12px 20px; /* 增加上下內距，讓按鈕變大更好按 */
            border-bottom: 1px solid #f0f0f0; /* 為每個項目加上底線分隔 */
        }

        .navbar .menu li:last-child a {
            border-bottom: none; /* 最後一個項目不用底線 */
        }
    }

    }
  </style>
</head>

<body>
  <nav class="navbar">

            <li><a href="#" data-module="album2">Album2</a></li>
          </ul>
        </li>
        <!-- <li><a href="#">Projects ⏷</a></li> -->
        <li class="dropdown">
          <a href="#">Projects ⏷</a>
          <ul class="dropdown-menu">
            <li><a href="#" data-module="project1">Project1</a></li>
            <li><a href="#" data-module="project2">Project2</a></li>
            <li><a href="#" data-module="project3">Project3</a></li>
          </ul>
        <!-- <li><a href="#">Contact</a></li> -->
        <li class="dropdown">
          <a href="#">Contact</a>
          <ul class="dropdown-menu">
            <li><a href="#" data-module="contact">Mail Address</a></li>
            <li><a href="#" data-module="contact">Instagram</a></li>
            <li><a href="https://cn.pornhub.com/model/jasonhousework" target="_blank" rel="noopener">PornHub</a></li>
          </ul>
      </ul>
    </div>
  </nav>

  <div class="full-width-banner">
    <img src="images/hero1.jpg" alt="大圖展示" />
  </div>

  <main id="main-content" tabindex="-1">
    <div class="container" id="content">
      <!-- 內容動態載入 -->
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/navbar-toggle.js"></script>
</body>
</html>
